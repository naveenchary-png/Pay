<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay rent</title>
<style>
  body{font-family:Arial,sans-serif;max-width:420px;margin:0 auto;padding:26px 18px;text-align:center;color:#222;background:#fff}
  .pg{color:#1F3864;font-weight:bold;letter-spacing:1px;text-transform:uppercase;font-size:13px}
  .amt{font-size:44px;font-weight:bold;margin:6px 0}
  .btn{display:block;width:100%;box-sizing:border-box;border:0;border-radius:12px;padding:16px;font-size:18px;font-weight:bold;
       text-decoration:none;color:#fff;margin:10px 0}
  .gp{background:#1a73e8}.pp{background:#5f259f}.pt{background:#00b9f1}.any{background:#1F3864}
  .copy{background:#fff;color:#1F3864;border:2px solid #1F3864}
  .paid{background:#2e7d32}
  .small{font-size:13px;color:#555}
  .steps{border:2px solid #1F3864;border-radius:12px;padding:14px;margin:16px 0;text-align:left}
  .steps ol{margin:8px 0 0;padding-left:20px;font-size:15px;line-height:1.6}
  .num{font-size:24px;font-weight:bold;text-align:center;letter-spacing:1px;margin:8px 0}
  input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:15px;margin:6px 0}
  hr{border:0;border-top:1px solid #ddd;margin:22px 0}
</style>
</head>
<body>
<div id="app"><p class="small">Loading...</p></div>

<script>
// ====== EDIT THIS ONE LINE ======
// Paste your Apps Script Web App URL (ends in /exec)
var APPS_URL = "https://script.google.com/macros/s/AKfycbxt3pEbpdCsmvC8kSIlsqs78_OPoMIU2Gq6P6Ry14PosXoSCMUtONUvnt7f-KdhrOV-/exec";
// ================================

var ua = navigator.userAgent;
var isAndroid = /Android/i.test(ua);
var isIOS = /iPhone|iPad|iPod/i.test(ua);
var token = new URLSearchParams(location.search).get("t") || "";
var app = document.getElementById("app");

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function inr(n){return Number(n).toLocaleString("en-IN");}
function show(html){app.innerHTML = html;}

if (!token) {
  show("<h2>Link not valid</h2><p>Please ask your PG owner for a new link.</p>");
} else if (APPS_URL.indexOf("PASTE_") === 0) {
  show("<h2>Setup needed</h2><p class='small'>Owner: edit APPS_URL in index.html.</p>");
} else {
  fetch(APPS_URL + "?info=1&t=" + encodeURIComponent(token))
    .then(function(r){return r.json();})
    .then(render)
    .catch(function(){ show("<h2>Could not load</h2><p>Please check your internet and reload this page.</p>"); });
}

function render(d) {
  if (!d || !d.ok) { show("<h2>Link not valid</h2><p>Please ask your PG owner for a new link.</p>"); return; }
  if (d.status === "Paid") { show("<h2>&#10003; Rent paid</h2><p>" + esc(d.name) + ", your rent for " + esc(d.month) + " is marked paid. Thank you!</p>"); return; }
  if (d.status === "Claimed") { show("<h2>Payment noted</h2><p>" + esc(d.name) + ", thanks. Your PG owner will confirm it shortly.</p>"); return; }

  var note = "Rent " + d.month + " Room " + d.room;
  var qs = "pa=" + encodeURIComponent(d.upi) + "&pn=" + encodeURIComponent(d.owner) +
           "&am=" + Number(d.amount).toFixed(2) + "&cu=INR&tn=" + encodeURIComponent(note);

  function intentUrl(pkg){ return "intent://pay?" + qs + "#Intent;scheme=upi;package=" + pkg + ";end"; }
  var gpay = isAndroid ? intentUrl("com.google.android.apps.nbu.paisa.user") : "gpay://upi/pay?" + qs;
  var phonepe = isAndroid ? intentUrl("com.phonepe.app") : "phonepe://pay?" + qs;
  var paytm = isAndroid ? intentUrl("net.one97.paytm") : "paytmmp://pay?" + qs;
  var any = "upi://pay?" + qs;
  var onPhone = isAndroid || isIOS;

  var limit = Number(d.limit) || 2000;
  var hasMobile = !!d.mobile;
  // App links are blocked by the payment apps for large amounts, so only offer them for small ones.
  var showButtons = onPhone && (!hasMobile || Number(d.amount) <= limit);

  var steps = hasMobile ?
    '<div class="steps"><b>Pay by mobile number</b><ol>' +
    '<li>Open GPay / PhonePe / Paytm</li>' +
    '<li>Tap <b>Pay phone number</b></li>' +
    '<li>Enter this number:<div class="num" id="mob">' + esc(d.mobile) + '</div></li>' +
    '<li>Amount <b>&#8377;' + inr(d.amount) + '</b>, note: <b>Room ' + esc(d.room) + '</b></li></ol>' +
    '<button class="btn copy" onclick="copyText(\'mob\',\'Number copied.\')">Copy number</button>' +
    '<p class="small" style="margin:0">Name shown: ' + esc(d.owner) + '</p></div>'
    : '';

  var buttons = showButtons ?
    '<a class="btn gp" href="' + esc(gpay) + '">Pay with GPay</a>' +
    '<a class="btn pp" href="' + esc(phonepe) + '">Pay with PhonePe</a>' +
    '<a class="btn pt" href="' + esc(paytm) + '">Pay with Paytm</a>' +
    '<a class="btn any" href="' + esc(any) + '">Other UPI app</a>'
    : '';

  var upiBlock = hasMobile ? '' :
    '<p class="small">App shows a payment limit message? Copy the UPI ID below, then in your app choose <b>Pay to UPI ID</b> and enter <b>&#8377;' + inr(d.amount) + '</b>.</p>' +
    '<p class="small">UPI ID<br><b id="upi">' + esc(d.upi) + '</b></p>' +
    '<button class="btn copy" onclick="copyText(\'upi\',\'UPI ID copied.\')">Copy UPI ID</button>';

  show(
    '<p class="pg">' + esc(d.pg) + '</p>' +
    '<h2>Hi ' + esc(d.name) + '</h2>' +
    '<p>Rent for <b>' + esc(d.month) + '</b> (Room ' + esc(d.room) + ')</p>' +
    '<div class="amt">&#8377;' + inr(d.amount) + '</div>' +
    '<p class="small">Due ' + esc(d.due) + '</p>' +
    steps + buttons + upiBlock +
    '<hr><p><b>Already paid?</b></p>' +
    '<input id="ref" placeholder="UTR / reference no. (optional)" maxlength="40">' +
    '<button class="btn paid" id="cl" onclick="claim()">I have paid</button>' +
    '<p class="small" id="msg"></p>'
  );
}

function copyText(id, okMsg) {
  var t = document.getElementById(id).innerText;
  var m = document.getElementById("msg");
  function fallback() {
    var r = document.createRange(); r.selectNodeContents(document.getElementById(id));
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    m.innerText = "Selected. Long-press and tap Copy.";
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function(){ m.innerText = okMsg; }, fallback);
  } else { fallback(); }
}

function claim() {
  var b = document.getElementById("cl"), m = document.getElementById("msg");
  b.disabled = true; m.innerText = "Saving...";
  fetch(APPS_URL + "?claim=1&t=" + encodeURIComponent(token) + "&ref=" + encodeURIComponent(document.getElementById("ref").value))
    .then(function(r){return r.text();})
    .then(function(t){
      var r;
      try { r = JSON.parse(t); } catch (e) {
        b.disabled = false;
        m.innerText = "Server returned an error page. Owner: redeploy the Web App as a New version and run Rent Bot > 9. Authorize all permissions.";
        return;
      }
      if (r.result === "ok") { m.innerText = "Thanks! Your owner has been notified and will confirm."; }
      else { b.disabled = false; m.innerText = r.result || "Could not save."; }
    })
    .catch(function(){ b.disabled = false; m.innerText = "Could not reach the server. Please check your internet and try again."; });
}
</script>
</body>
</html>
